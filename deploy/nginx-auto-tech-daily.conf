# Serve only the generated index, never the code, state or environment file.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    root /var/lib/auto-tech-daily/site;
    autoindex off;
    charset utf-8;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Cache-Control "no-cache" always;

    location = / {
        try_files /index.html =404;
    }
    location = /index.html {
        try_files /index.html =404;
    }
    location / {
        return 404;
    }
}
